# PRISM Helm Values

n8n:
  image: n8nio/n8n:latest
  serviceType: LoadBalancer
  storageSize: 1Gi
  env:
    dbType: postgresdb

openclaw:
  image: caprihan/openclaw:latest
  serviceType: ClusterIP

postgres:
  image: postgres:14-alpine
  password: n8npassword
  storageSize: 1Gi

redis:
  image: redis:latest

monitoring:
  enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: true
