apiVersion: v1
kind: Secret
metadata:
  name: prism-secrets
  namespace: prism
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_PASSWORD: n8npassword
  
  # AI Provider Keys (Teammate C will provide these)
  GEMINI_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  
  # n8n Encryption Key
  N8N_ENCRYPTION_KEY: prism_secret_key
  
  # OpenClaw Auth Token
  OPENCLAW_AUTH_TOKEN: your_secure_token
